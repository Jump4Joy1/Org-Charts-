name: Android debug build

# Sanity-checks the Capacitor/Gradle pipeline on every push, and leaves a
# sideloadable debug APK behind as a workflow artifact. Not signed for the
# Play Store; that's a separate release workflow once there's a keystore.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'www/**'
      - 'index.html'
      - 'app.js'
      - 'design-tokens.js'
      - 'schema.js'
      - 'command.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/sync-www.js'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install npm dependencies
        run: npm ci

      - name: Sync web assets into the Android project
        run: npm run cap:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: orgchart-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
